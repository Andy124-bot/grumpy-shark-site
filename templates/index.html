<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=4" type="image/x-icon">
    <title>Grumpy Shark's World</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <!-- Improved Navigation -->
    <nav class="grumpy-navbar">
        <a href="/books" class="link-box">Books</a>
        <a href="/payment" class="link-box">About</a>
        <a href="/contact" class="link-box">Contact</a>
    </nav>

    <!-- Main Content -->
    <main id="main">
        <!-- Voice Controls -->
        <button id="read-btn" class="speak-btn" onclick="narratePage()">🔊 Read This Page Aloud</button>
        <button id="stop-btn" class="speak-btn" onclick="stopNarration()">⏹️ Stop Narration</button>



        <!-- Tagline -->
        <p class="hungry">🦈 Hungry for adventure? Grumpy Shark's books are full of fun! Click the Books button to
            explore the reef.</p>

        <!-- Book Teaser -->
        <section class="book-highlight">
            <h2>Start Your Adventure</h2>
            <div class="book-gallery">
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_1_cover.png') }}"
                        alt="Grumpy Shark Book 1 Cover">
                </div>
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_2_cover.png') }}"
                        alt="Grumpy Shark Book 2 Cover">
                </div>
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_3_cover.png') }}"
                        alt="Grumpy Shark Book 3 Cover">
                    <p class="coming-soon">!!!COMING SOON!!!</p>
                </div>
            </div>
        </section>

    </main>

    <audio id="bg-music" src="{{ url_for('static', filename='audio/grumpy_song.wav') }}" autoplay loop></audio>
    <button onclick="stopMusicOnly()">🛑 Stop Music</button>
    <button onclick="startMusic()">▶️ Play Music</button>

    <footer>
        <p>&copy; 2025 Grumpy Shark Productions. All rights reserved.</p>
    </footer>
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}?v=2"></script>
</body>

</html>
