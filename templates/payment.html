<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grumpy Shark Adventures</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <!-- 🔊 Narration Controls -->
    <button id="read-btn" class="speak-btn" onclick="narratePage()">🔊 Read This Page Aloud</button>
    <button id="stop-btn" class="speak-btn" onclick="stopNarration()">⏹️ Stop Narration</button>

    <!-- ✅ Main content for screen readers and narration -->
    <main id="main">
        <section class="book-display">
            <h2>Click Author Button ToPurchase Grumpy's Adventures</h2>
            <div class="book-row">
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_1_cover.png') }}" alt="Grumpy Shark Book 1 Cover">
                    <p class="book-label">Grumpy Shark Book 1  $15.00</p>
                </div>
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_2_cover.png') }}" alt="Grumpy Shark Book 2 Cover">
                    <p class="book-label">Grumpy Shark Book 2  $20.00</p>
                </div>
                <div class="book-tile">
                    <img src="{{ url_for('static', filename='books/grumpy_3_cover.png') }}" alt="Grumpy Shark Book 3 Cover">
                    <p class="book-label">Grumpy Shark Book 3  $25.00</p>
                </div>
            </div></section>

        <a href="{{ url_for('contact') }}" class="home-btn">📚 Contact Author for Purchase</a>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
