<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=4" type="image/x-icon">
</head>

<body class="about-page">
    <header>
        <nav class="grumpy-navbar">
            <a href="/books" class="link-box">Books</a>
            <a href="/about" class="link-box">About</a>

    <main>

        <button id="read-btn" class="speak-btn" onclick="narratePage()">🔊 Read This Page Aloud</button>

        <section class="book-display">
            <img src="{{ url_for('static', filename='books/grumpy_1_cover.png') }}" alt="Book 1 Cover">

        <section class="about-box">
            <h3>About This Book</h3>
            <textarea placeholder="Type details about Book 1 here..."></textarea>
        </section>


    </main>

    <footer>

    </footer>
